version: 2
updates:
  # Keeps the SHA-pinned actions current. Majors get their own PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
