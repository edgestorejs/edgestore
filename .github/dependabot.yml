version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current. The cooldown
  # waits a week after an action release before proposing it, like pnpm's
  # minimumReleaseAge for npm packages.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
