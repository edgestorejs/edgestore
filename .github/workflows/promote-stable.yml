name: Promote stable

on:
  workflow_dispatch:

concurrency:
  group: promote-stable
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    name: Prepare stable promotion PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Validate release candidate
        id: source
        run: |
          jq -e \
            '.mode == "pre" and .tag == "rc"' \
            .changeset/pre.json
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Generate stable versions
        run: |
          pnpm changeset pre exit
          pnpm -s run version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Open promotion PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          PR_BODY: |
            Promotes the release candidate on `main` to stable v1.

            - Exits Changesets prerelease mode.
            - Generates stable package versions and changelogs.
            - Publishes to npm `latest` after this PR is merged.

            Review and merge this version PR only when the release candidate is ready for stable v1.
        run: |
          branch="release/promote-stable-$SOURCE_SHA"
          existing_url="$(gh pr list \
            --base main \
            --head "$branch" \
            --state open \
            --json url \
            --jq '.[0].url // ""')"

          if [[ -n "$existing_url" ]]; then
            echo "Promotion PR already exists: $existing_url"
            exit 0
          fi

          git switch -c "$branch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: promote v1 to stable'
          git push -u origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title 'chore: promote v1 to stable' \
            --body "$PR_BODY"
