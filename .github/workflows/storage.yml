name: Storage providers

# Runs the direct-storage providers against local emulators. MinIO no longer
# publishes binaries or images, so a pinned release is built from source and
# cached. Azurite ships as a pinned Microsoft image.
on:
  pull_request:
    paths:
      - .github/workflows/storage.yml
      - packages/sdk/src/**
      - packages/server/src/**
      - packages/shared/src/**
      - pnpm-lock.yaml
  push:
    branches:
      - main
      - next
    paths:
      - .github/workflows/storage.yml
      - packages/sdk/src/**
      - packages/server/src/**
      - packages/shared/src/**
      - pnpm-lock.yaml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  s3-storage:
    name: S3 storage tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MINIO_VERSION: RELEASE.2025-04-22T22-12-26Z
      MINIO_GO_VERSION: '1.24.2'

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server dependencies
        run: pnpm turbo run build --filter=@edgestore/server^...

      - name: Cache MinIO binary
        id: minio-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/minio-bin
          key: minio-${{ runner.os }}-${{ runner.arch }}-${{ env.MINIO_VERSION }}-go${{ env.MINIO_GO_VERSION }}

      - name: Setup Go
        if: steps.minio-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.MINIO_GO_VERSION }}
          cache: false

      - name: Build MinIO
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: GOBIN="$RUNNER_TEMP/minio-bin" go install "github.com/minio/minio@$MINIO_VERSION"

      - name: Start MinIO
        run: |
          MINIO_ROOT_USER=edgestore-test MINIO_ROOT_PASSWORD=edgestore-test-password \
            "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:19000 > "$RUNNER_TEMP/minio.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19000/minio/health/live; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/minio.log"
          exit 1

      - name: S3 storage tests
        env:
          ES_S3_SMOKE_ENDPOINT: http://127.0.0.1:19000
        run: pnpm --filter @edgestore/server test:smoke src/providers/s3/s3.smoke.test.ts

  azure-blob:
    name: Azure Blob storage tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build server dependencies
        run: pnpm turbo run build --filter=@edgestore/server^...

      - name: Start Azurite
        run: |
          docker run -d --name azurite -p 127.0.0.1:10000:10000 \
            mcr.microsoft.com/azure-storage/azurite:3.37.0 \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null http://127.0.0.1:10000/; then exit 0; fi
            sleep 1
          done
          docker logs azurite
          exit 1

      - name: Azure Blob storage tests
        env:
          ES_AZURE_SMOKE_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
        run: pnpm --filter @edgestore/server test:smoke src/providers/azure-blob/azure-blob.smoke.test.ts
