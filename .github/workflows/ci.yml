name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  SKIP_ENV_VALIDATION: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency versions
        run: pnpm check:dependencies

      - name: Check formatting
        run: pnpm format --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Runtime tests
        run: pnpm test

      - name: Agent documentation contracts
        run: pnpm --filter docs test:agents

      - name: Agent evaluation policy contracts (no agent or cloud runs)
        run: pnpm eval:agents:test

      - name: Package agent references
        run: |
          pnpm agent-docs:test
          pnpm agent-docs:check
          pnpm agent-docs:pack-check
          pnpm agent-assets:check
          pnpm agent-assets:pack-check

      - name: Type tests
        run: pnpm test:types

  node-22-compatibility:
    name: Node 22 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      # The build tooling requires Node 24; consumers only need Node 22.22.0.
      - name: Setup build Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Pack packages
        run: pnpm --filter '@edgestore/*' -r pack --pack-destination "$RUNNER_TEMP/edgestore-packages"

      - name: Setup minimum supported Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0

      # Reuse the dependencies installed above and avoid invoking Turbo builds.
      - name: Runtime tests on Node 22
        run: pnpm --filter '@edgestore/*' -r test
        env:
          pnpm_config_verify_deps_before_run: 'false'

      - name: Install packed packages with strict engine checks
        run: npm install --prefix "$RUNNER_TEMP/edgestore-consumer" --engine-strict --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/edgestore-packages/"*.tgz

      - name: Load installed packages
        working-directory: ${{ runner.temp }}/edgestore-consumer
        run: |
          node --input-type=module -e "for (const name of ['server', 'react', 'shared', 'sdk']) await import('@edgestore/' + name)"
          node node_modules/@edgestore/cli/dist/bin.mjs --version

  cli-package-smoke:
    name: CLI package smoke (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.22.0', '24']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @edgestore/sdk build

      - name: Build CLI
        run: pnpm --filter @edgestore/cli build

      - name: Setup runtime Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}

      - name: Reuse installed dependencies for runtime checks
        shell: bash
        run: echo 'pnpm_config_verify_deps_before_run=false' >> "$GITHUB_ENV"

      - name: Validate zsh completion
        if: runner.os == 'macOS'
        run: pnpm --filter @edgestore/cli exec vitest run src/utility.test.ts

      - name: Load native credential store module
        run: pnpm --filter @edgestore/cli exec node -e "import('@napi-rs/keyring')"

      - name: Check executable
        run: node packages/cli/dist/bin.mjs --version

      - name: Pack package
        run: pnpm --filter @edgestore/cli pack
