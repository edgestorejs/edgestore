name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  SKIP_ENV_VALIDATION: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check release lane state
        if: github.event_name != 'workflow_dispatch' || github.ref_name == 'main' || github.ref_name == 'next' || endsWith(github.ref_name, '.x')
        run: pnpm release:check
        env:
          RELEASE_BRANCH: ${{ github.base_ref || github.ref_name }}

      - name: Test release guards
        run: pnpm test:release

      - name: Lint release tooling
        run: pnpm lint:release

      - name: Typecheck release tooling
        run: pnpm release:typecheck

      - name: Verify promotion source
        if: startsWith(github.head_ref, 'release/promote-next-') && github.base_ref == 'main'
        run: |
          expected_sha="${GITHUB_HEAD_REF#release/promote-next-}"
          git fetch origin main next
          test "$expected_sha" = "$(git rev-parse origin/next)"
          git merge-base --is-ancestor origin/main "$expected_sha"

      - name: Check formatting
        run: pnpm format --check

      - name: Check release tooling formatting
        run: pnpm format:release

      - name: Lint
        run: pnpm lint

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Runtime tests
        run: pnpm test

      - name: Type tests
        run: pnpm test:types
