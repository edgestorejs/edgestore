name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  SKIP_ENV_VALIDATION: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency versions
        run: pnpm check:dependencies

      - name: Check formatting
        run: pnpm format --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Runtime tests
        run: pnpm test

      - name: Start S3-compatible storage
        run: |
          docker run -d --name edgestore-s3-test -p 127.0.0.1:19000:9000 \
            -e MINIO_ROOT_USER=edgestore-test \
            -e MINIO_ROOT_PASSWORD=edgestore-test-password \
            quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:19000/minio/health/live; then exit 0; fi
            sleep 1
          done
          docker logs edgestore-s3-test
          exit 1

      - name: S3 provider storage smoke tests
        env:
          ES_S3_SMOKE_ENDPOINT: http://127.0.0.1:19000
        run: pnpm --filter @edgestore/server test:smoke src/providers/s3/s3.smoke.test.ts

      - name: Stop S3-compatible storage
        if: always()
        run: docker rm -f edgestore-s3-test || true

      - name: Agent documentation contracts
        run: pnpm --filter docs test:agents

      - name: Agent evaluation policy contracts (no agent or cloud runs)
        run: pnpm eval:agents:test

      - name: Package agent references
        run: |
          pnpm agent-docs:test
          pnpm agent-docs:check
          pnpm agent-docs:pack-check
          pnpm agent-assets:check
          pnpm agent-assets:pack-check

      - name: Type tests
        run: pnpm test:types

  cli-package-smoke:
    name: CLI package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @edgestore/sdk build

      - name: Build CLI
        run: pnpm --filter @edgestore/cli build

      - name: Validate zsh completion
        if: runner.os == 'macOS'
        run: pnpm --filter @edgestore/cli exec vitest run src/utility.test.ts

      - name: Load native credential store module
        run: pnpm --filter @edgestore/cli exec node -e "import('@napi-rs/keyring')"

      - name: Check executable
        run: node packages/cli/dist/bin.mjs --version

      - name: Pack package
        run: pnpm --filter @edgestore/cli pack
