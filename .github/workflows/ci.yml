name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: 1
  SKIP_ENV_VALIDATION: true
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check dependency versions
        run: pnpm check:dependencies

      - name: Check formatting
        run: pnpm format --check

      - name: Lint
        run: pnpm lint

      - name: Typecheck packages
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build

      - name: Runtime tests
        run: pnpm test

      - name: Type tests
        run: pnpm test:types

  cli-package-smoke:
    name: CLI package smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter @edgestore/sdk build

      - name: Build CLI
        run: pnpm --filter @edgestore/cli build

      - name: Validate zsh completion
        if: runner.os == 'macOS'
        run: pnpm --filter @edgestore/cli exec vitest run src/utility.test.ts

      - name: Load native credential store module
        run: pnpm --filter @edgestore/cli exec node -e "import('@napi-rs/keyring')"

      - name: Check executable
        run: node packages/cli/dist/bin.mjs --version

      - name: Pack package
        run: pnpm --filter @edgestore/cli pack
