packages:
  - 'docs'
  - 'examples/*'
  - 'packages/*'

catalog:
  '@aws-sdk/client-s3': 3.1091.0
  '@aws-sdk/s3-request-presigner': 3.1091.0
  '@radix-ui/react-slot': 1.2.3
  '@tailwindcss/postcss': 4.3.3
  '@types/express': 5.0.6
  '@types/node': 25.0.3
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  astro: 7.1.3
  class-variance-authority: 0.7.1
  express: 5.2.1
  fastify: 5.10.0
  hono: 4.12.31
  next: 16.4.1
  react: 19.2.7
  react-dom: 19.2.7
  react-dropzone: 20.1.2
  tailwindcss: 4.3.3
  tsx: 4.23.1
  tw-animate-css: 1.4.0
  typescript: 6.0.3

publicHoistPattern:
  - '@types/*'
strictPeerDependencies: false
linkWorkspacePackages: true
preferWorkspacePackages: true
savePrefix: ''
catalogMode: manual
cleanupUnusedCatalogs: true

overrides:
  '@edgestore/server': 'workspace:*'
  '@edgestore/sdk': 'workspace:*'
  '@edgestore/shared': 'workspace:*'
  '@edgestore/react': 'workspace:*'

# Fail when a version has weaker publish trust evidence (trusted publisher or
# provenance) than earlier versions of the same package, a sign the
# publisher's credentials may have been stolen.
trustPolicy: no-downgrade
# Legitimate maintenance releases of older majors that were published with
# weaker evidence than the newer majors. semver 5.7.2 and 6.3.1 are the July
# 2023 ReDoS backports, published by an npm CLI maintainer without provenance.
# vite 5.4.21 was published by vitebot with provenance but without trusted
# publishing, alongside 6.4.1 and 7.1.11. Add exact versions only.
trustPolicyExclude:
  - semver@5.7.2
  - semver@6.3.1
  - vite@5.4.21

minimumReleaseAgeStrict: true
# Next.js 16.4.1 is the October 14, 2026 security release. Remove these once
# it is older than the default one-day minimum release age.
minimumReleaseAgeExclude:
  - next@16.4.1
  - '@next/env@16.4.1'
  - '@next/swc-darwin-arm64@16.4.1'
  - '@next/swc-darwin-x64@16.4.1'
  - '@next/swc-linux-arm64-gnu@16.4.1'
  - '@next/swc-linux-arm64-musl@16.4.1'
  - '@next/swc-linux-x64-gnu@16.4.1'
  - '@next/swc-linux-x64-musl@16.4.1'
  - '@next/swc-win32-arm64-msvc@16.4.1'
  - '@next/swc-win32-x64-msvc@16.4.1'

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  esbuild: false
  protobufjs: false
  sharp: false
