packages:
  - 'docs'
  - 'examples/*'
  - 'packages/*'

catalog:
  '@aws-sdk/client-s3': 3.1091.0
  '@aws-sdk/s3-request-presigner': 3.1091.0
  '@radix-ui/react-slot': 1.2.3
  '@tailwindcss/postcss': 4.3.3
  '@types/express': 5.0.6
  '@types/node': 25.0.3
  '@types/react': 19.2.17
  '@types/react-dom': 19.2.3
  astro: 7.1.3
  class-variance-authority: 0.7.1
  express: 5.2.1
  fastify: 5.10.0
  hono: 4.12.31
  next: 16.2.10
  react: 19.2.7
  react-dom: 19.2.7
  react-dropzone: 14.4.1
  tailwindcss: 4.3.3
  tsx: 4.23.1
  tw-animate-css: 1.4.0
  typescript: 6.0.3

publicHoistPattern:
  - '@types/*'
strictPeerDependencies: false
linkWorkspacePackages: true
preferWorkspacePackages: true
savePrefix: ''
catalogMode: manual
cleanupUnusedCatalogs: true

overrides:
  '@edgestore/server': 'workspace:*'
  '@edgestore/shared': 'workspace:*'
  '@edgestore/react': 'workspace:*'

minimumReleaseAgeStrict: true

allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  core-js: false
  esbuild: false
  sharp: false
